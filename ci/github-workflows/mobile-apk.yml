# Builds an UNSIGNED/DEBUG Android APK of the Expo app in mobile/ on every push to main,
# uploads it as a workflow artifact, and publishes it as a GitHub Release (tag build-<run_number>).
#
# No secrets are required. The release step uses the built-in GITHUB_TOKEN
# (needs "contents: write", granted below).
#
# The app is an Expo *managed* project: mobile/android/ is gitignored and generated here by
# `expo prebuild`. A debug APK is signed with the standard Android debug key, so it installs on
# any device with "Install unknown apps" enabled, but it is NOT suitable for the Play Store.

name: Mobile APK (Android debug)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Backend the app talks to (inlined into the JS bundle at build time).
  # Override with a repository variable named EXPO_PUBLIC_API_URL (Settings → Variables).
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://fit-trk.vercel.app' }}
  # Yarn 4 enables --immutable automatically on CI; keep it, mobile/yarn.lock is committed.
  YARN_ENABLE_GLOBAL_CACHE: "false"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack (Yarn 4 from mobile/package.json "packageManager")
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: mobile/.yarn/cache
          key: yarn-mobile-${{ runner.os }}-${{ hashFiles('mobile/yarn.lock') }}
          restore-keys: yarn-mobile-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package.json', 'mobile/yarn.lock', 'mobile/app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        id: apk
        run: |
          NAME="FitTracker-build-${{ github.run_number }}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fittracker-debug-apk
          path: mobile/${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FitTracker Android build ${{ github.run_number }} (debug)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: mobile/${{ steps.apk.outputs.name }}
          body: |
            Unsigned **debug** APK built from ${{ github.sha }}.
            Backend: `${{ env.EXPO_PUBLIC_API_URL }}`

            Install: download the `.apk` below on your Android phone and open it
            (allow "Install unknown apps" for your browser/file manager when prompted).
